name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package
        run: pnpm package:extension

      # Catches the manifest mistakes Chrome only reports as an opaque
      # "Could not load manifest" when a human tries to install the result.
      - name: Validate manifest
        run: pnpm validate:manifest

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: recall-unpacked-${{ github.sha }}
          path: dist/recall-chromium-extension
          retention-days: 14
