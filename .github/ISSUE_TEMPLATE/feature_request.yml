name: Feature request
description: Suggest something Recall should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Recall makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This works without sending my data anywhere
          required: true
