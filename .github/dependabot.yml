version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      radix:
        patterns: ["@radix-ui/*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
